<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shackle (curved top) -->
  <path d="M 30 45 Q 30 20 50 20 Q 70 20 70 45"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round" />
  
  <!-- Body (rectangle) -->
  <rect x="25" y="45" width="50" height="50" 
    rx="3"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5" />
  
  <!-- Keyhole (circle) -->
  <circle cx="50" cy="60" r="4" fill="currentColor" />
  
  <!-- Keyhole (rectangle below) -->
  <rect x="49" y="65" width="2" height="15" fill="currentColor" />
</svg>