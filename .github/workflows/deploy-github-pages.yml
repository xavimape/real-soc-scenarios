name: Deploy to GitHub Pages

# Manual y por push a main. El despliegue a Cloudflare Pages no usa este
# workflow: Cloudflare compila desde su propio panel con `npm run build`, sin
# BASE_PATH, porque sirve desde la raíz del dominio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez. No se cancela el que está corriendo para no dejar el
# sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # A nivel de job y no del paso de build, a propósito. El verificador de
    # defangueo necesita SITE_URL para saber cuál es el host del propio sitio y
    # no confundirlo con un indicador. Declarada solo en el paso que compila, el
    # paso que verifica no la ve y marca las 34 páginas.
    env:
      # Sitio de proyecto: vive en /<repo>/, no en la raíz.
      BASE_PATH: /${{ github.event.repository.name }}
      SITE_URL: https://${{ github.repository_owner }}.github.io

    steps:
      - uses: actions/checkout@v7

      # La versión sale de .nvmrc, que es la que también usa el desarrollo local.
      # Dos lugares con el número escrito a mano se separan en cuanto uno cambia.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verificar que no salgan indicadores vivos
        run: node scripts/check-defang.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
