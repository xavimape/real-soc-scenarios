<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Real SOC Scenarios">
  <!--
    Marca del sitio: un prompt de terminal.

    Se eligió sobre un escudo o un candado porque describe mejor lo que el sitio
    enseña. Un escudo dice "seguridad" en abstracto; un prompt dice "acá se leen
    registros", que es lo que hace un analista en los dieciséis casos.

    Reusa el vocabulario que el encabezado ya tiene: ahí el icono de código
    también es una terminal con prompt, por el mismo motivo.

    El fondo va horneado y no transparente. Un favicon transparente desaparece
    contra la barra oscura de algunos navegadores y contra las tarjetas claras de
    las apps de mensajería; con fondo propio se ve igual en las dos.

    El verde es el del globo de la portada y no el violeta del acento: el violeta
    era lo que hacía que el sitio pareciera la plantilla de la que salió.
  -->
  <rect width="128" height="128" rx="26" fill="#0d1117" />
  <g fill="none" stroke="#00e05a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 42 L64 64 L40 86" />
    <path d="M74 86 L94 86" />
  </g>
</svg>
